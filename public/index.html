<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunaris — NNUE chess engine</title>
<meta name="description" content="Play against Lunaris, a custom NNUE chess engine, and watch it play itself live.">
<link rel="stylesheet" href="./style.css">
<script src="./theme-init.js"></script>
<link rel="icon" type="image/svg+xml" href="./logo.svg">
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" id="logo" viewBox="-0.3 -0.3 3.6 3.6" height="28" width="28" role="img" aria-label="Lunaris"><path d="M1 0H2L3 1V2L2 3H1L0 2V1Z" fill="none" stroke="currentColor" stroke-width=".2" stroke-linejoin="round"/><path d="M1 0V2L2 3" fill="none" stroke="#5a00ff" stroke-width=".26" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <b>Lunaris</b><span class="ver" id="ver">NNUE chess engine</span></div>
  <nav>
    <button class="tab active" data-tab="play" data-i18n="tab_play">대국</button>
    <button class="tab" data-tab="live" data-i18n="tab_live">라이브 자가대국</button>
  </nav>
  <select id="skin" title="Skin"></select>
  <button id="theme" class="ghost" title="Light / Dark">☀</button>
  <button id="lang" class="ghost" title="Language">EN</button>
</header>
<div id="themebar" class="themebar hidden"><span data-i18n="pthemes">기물 테마</span> <label><span data-i18n="pw">백</span> <select id="pt-w"></select></label> <label><span data-i18n="pb">흑</span> <select id="pt-b"></select></label></div>

<main>
  <!-- ============ PLAY ============ -->
  <section id="view-play" class="view">
    <div class="stage">
      <div class="evalbar" id="p-eval"><div class="fill"></div><span class="evtxt"></span></div>
      <div class="boardwrap">
        <div class="nameplate top" id="p-top"></div>
        <div id="p-board" class="boardhost"></div>
        <div class="nameplate bot" id="p-bot"></div>
      </div>
    </div>
    <aside class="panel">
      <div class="card">
        <div class="row">
          <label><span data-i18n="color">색</span>
            <select id="p-color">
              <option value="w" data-i18n="white">백</option>
              <option value="b" data-i18n="black">흑</option>
              <option value="r" data-i18n="random">랜덤</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label><span><span data-i18n="thinktime">생각 시간</span>: <b id="p-time-val">1초</b></span>
            <span class="timerow">
              <input type="number" id="p-time" min="0" step="any" value="1" inputmode="decimal">
              <select id="p-unit"><option value="1">ms</option><option value="1000" selected>초</option><option value="60000">분</option></select>
            </span>
          </label>
        </div>
        <button id="p-new" class="primary" data-i18n="newgame">새 게임</button>
      </div>
      <div class="card status" id="p-status" aria-live="polite"></div>
      <div class="card">
        <div class="moves" id="p-moves"></div>
        <div class="row btns">
          <button id="p-undo" data-i18n="undo">무르기</button>
          <button id="p-flip" data-i18n="flip">판 뒤집기</button>
          <button id="p-resign" data-i18n="btn_resign">기권</button>
        </div>
      </div>
      <div class="card info" id="p-info"></div>
    </aside>
  </section>

  <!-- ============ LIVE ============ -->
  <section id="view-live" class="view hidden">
    <div class="stage">
      <div class="evalbar" id="l-eval"><div class="fill"></div><span class="evtxt"></span></div>
      <div class="boardwrap">
        <div class="nameplate top" id="l-top"></div>
        <div id="l-board" class="boardhost"></div>
        <div class="nameplate bot" id="l-bot"></div>
        <div class="scrub">
          <button id="l-first">⏮</button><button id="l-prev">◀</button><button id="l-next">▶</button><button id="l-last">⏭</button>
          <button id="l-golive" class="primary small" data-i18n="golive">● 라이브</button>
        </div>
      </div>
    </div>
    <aside class="panel">
      <div class="card" id="l-head"></div>
      <div class="card" id="l-pace-card">
        <div class="row">
          <label><span><span data-i18n="pace">수 간격</span>: <b id="l-pace-val"></b></span>
            <select id="l-pace"></select>
          </label>
        </div>
      </div>
      <div class="card">
        <div class="moves" id="l-moves"></div>
      </div>
      <div class="card" id="l-stats"></div>
      <div class="card">
        <h3 data-i18n="recent">최근 대국</h3>
        <div id="l-recent" class="recent"></div>
        <a href="./games.pgn" id="l-pgn" class="link" download data-i18n="pgn">PGN 내려받기 (최근 2MB)</a>
      </div>
    </aside>
  </section>
</main>

<footer>
  <span data-i18n="foot">Lunaris는 직접 학습한 NNUE 평가 함수를 쓰는 UCI 체스 엔진입니다.</span>
</footer>

<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
